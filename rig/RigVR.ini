; RigVR: a load-bearing rig on a mannequin (Into the Radius style) for Fallout 4 VR.
; Units are game units (1 unit is about 1.43 cm).
; The rig itself (its models, the bones they follow, where pouches may hang, the starting layout) is in
; Data\F4SE\Plugins\RigVR\Rigs\RigBase.txt, written from Blender.

[General]
; 0 = the gun is in the right hand, 1 = left
iGunHand=0
; OpenVR button id of the grip
iGripButton=2
bHaptics=1
bMessages=1
; detail for testing in Documents\My Games\Fallout4VR\F4SE\RigVR.log
bDebugLog=1

[Hanging]
; a pouch item this close to a gripping palm counts as held by it
fHoldRadius=16
; a held pouch this close to the rig hangs there when you let go (the places it may hang light up)
fSnapRadius=20
; the places light up with a pouch in the hand this close to the mannequin's middle
fShowAreas=120
; a pouch held this close to upright (degrees) hangs straight; tilted more, it hangs tilted
fUpSnapDegrees=25

[Mannequin]
; the mannequin is used while you stand this close to it
fMannequinReach=150
; both hands this close to the mannequin's shoulders (both grips pressed together) put the rig on / hang it back
fWearRadius=14
fWearWindow=0.6
; the shoulders in the mannequin's own space: right, forward, up
fShoulderX=14.7
fShoulderY=-3.4
fShoulderZ=105
; hold the grip on the mannequin's head (this high) this long to fold it back into the inventory
fHeadZ=116
fPackSeconds=1.5

[Use]
; an item you let go of in the bag, this close to the palm, goes in
fStoreRadius=16
; a chem / food taken from the bag, this close to your mouth, is used
fMouthRadius=12
fHolsterCooldown=1.0
