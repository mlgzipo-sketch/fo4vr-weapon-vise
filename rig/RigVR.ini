; RigVR: a load-bearing rig on a mannequin (Into the Radius style) for Fallout 4 VR.
; Units are game units (1 unit is about 1.43 cm).

[General]
; 0 = the gun is in the right hand, 1 = left
iGunHand=0
; OpenVR button id of the grip
iGripButton=2
bHaptics=1
bMessages=1
; detail for testing in Documents\My Games\Fallout4VR\F4SE\RigVR.log
bDebugLog=1

[Reach]
; the palm this close to a pouch or a free place on the rig
fSlotRadius=8
; a gun place on the back is found by feel, from further away
fBackRadius=16
; ..and a holster
fHolsterRadius=12
; the mannequin is used while you stand this close to it
fMannequinReach=150
; the pouches on the mannequin are drawn from this far away
fMannequinDraw=1500
; both hands this close to the mannequin's shoulders (both grips pressed together) put the rig on / hang it back
fWearRadius=12
fWearWindow=0.5
; hold the grip on the mannequin's head this long to fold it back into the inventory
fPackSeconds=1.5
; an item you let go of over a pouch, this close to the palm, goes in
fStoreRadius=16
; a chem / food taken from a pouch, this close to your mouth, is used
fMouthRadius=12
fHolsterCooldown=1.0

[Body]
; places on the body follow FRIK's bones (pelvis, chest, thighs, upper arms). 0 = from your position only
bUseBones=1
; without bones (and on the mannequin): heights of the belt and of the chest panel
fBeltHeight=66
fChestHeight=92
; move the places on your body: up / down for the belt and the chest, forward / back for all
fBeltUp=0
fChestUp=0
fBodyForward=0
; places on the body are this much further from the middle than on the mannequin (a bigger body: more)
fBodyScale=1.0
; draw the outline of the rig on yourself (it is always drawn on the mannequin)
bShowRigOnBody=0
bShowPouchesOnBody=1

[Shelf]
; the shelf of pouches beside the mannequin (right of it, from its belt)
fTrayX=30
fTrayY=4
fTrayZ=104
fTrayStep=9

[Places]
; each place on the rig: right, forward, up from its anchor, the pouch's turn in degrees (+ = to the right),
; and optionally the anchor (0 belt, 1 chest). SlotN=off turns a place off.
; Slot0 magazine pouch at the belt front, Slot1 bag on the left hip, Slot2 pistol holster on the right hip,
; Slot3/4 long guns over the right/left shoulder, Slot5 chest front, Slot6 bag on the back; Slot7..12 off.
;Slot0=0,8.1,6.05,0,0
;Slot1=-13.9,1.1,7.3,-90,0
;Slot2=11.5,3.25,6.25,90,0
;Slot3=6.55,-8.4,7.65,180,1
;Slot4=-6.55,-8.4,7.65,180,1
;Slot5=0,10.5,0,0,1
;Slot6=0,-13.9,7.3,180,0

[Models]
; A model in Data\Meshes\RigVR\Custom\ with the hologram's file name (PouchMag.nif, Rig.nif, Mannequin.nif...)
; replaces it by itself. Or any model: sModel_<name>=path under Meshes (no "Meshes\").
; fScale_<name>, fRot_<name>=x,y,z (degrees), fOffset_<name>=right,forward,up (game units) make it sit right.
; Names: Mannequin, Rig, Ghost, Cursor, Mag, Med, Grenade, Holster, Dump, Bandolier, Sling.
; A pouch's front faces outwards from the body (+Y), its middle is the place itself.
;sModel_Mag=RigVR\PouchMag.nif
;fScale_Mag=1.0
;fRot_Mag=0,0,0
;fOffset_Mag=0,0,0
