; RigVR: a load-bearing rig on a mannequin (Into the Radius style) for Fallout 4 VR.
; Units are game units (1 unit is about 1.43 cm).

[General]
; 0 = the gun is in the right hand, 1 = left
iGunHand=0
; OpenVR button id of the grip
iGripButton=2
bHaptics=1
bMessages=1
; detail for testing in Documents\My Games\Fallout4VR\F4SE\RigVR.log
bDebugLog=1

[Reach]
; the palm this close to a pouch or a free place on the rig
fSlotRadius=8
; the mannequin is used while you stand this close to it
fMannequinReach=150
; both hands this close to the rig's chest (with both grips pressed together) put it on / take it off
fWearRadius=20
fWearWindow=0.5
; hold the grip on the mannequin's head this long to fold it back into the inventory
fPackSeconds=1.5
; an item you let go of over a pouch, this close to the palm, goes in
fStoreRadius=16
; a chem / food taken from a pouch, this close to your mouth, is used
fMouthRadius=12
fHolsterCooldown=1.0

[Body]
; places on the body follow FRIK's bones (pelvis, chest, thighs, upper arms). 0 = from your position only
bUseBones=1
; without bones (and on the mannequin): heights of the belt and of the chest panel
fBeltHeight=66
fChestHeight=92
; move the places on your body: up / down for the belt and the chest, forward / back for all
fBeltUp=0
fChestUp=0
fBodyForward=0
; places on the body are this much further from the middle than on the mannequin (a bigger body: more)
fBodyScale=1.0
; draw the outline of the rig on yourself (it is always drawn on the mannequin)
bShowRigOnBody=0
bShowPouchesOnBody=1

[Shelf]
; the shelf of pouches beside the mannequin (right of it, from its belt)
fTrayX=30
fTrayY=4
fTrayZ=104
fTrayStep=9

[Places]
; each place on the rig: right, forward, up from its anchor, and the pouch's turn in degrees (+ = to the right).
; Slot0..5 hang on the chest panel, Slot6..10 on the belt.
;Slot0=-8,9,4,0
;Slot1=0,9.5,4,0
;Slot2=8,9,4,0
;Slot3=-8,9,-6,0
;Slot4=0,9.5,-6,0
;Slot5=8,9,-6,0
;Slot6=-13,1,-2,-90
;Slot7=-9,8,0,-35
;Slot8=9,8,0,35
;Slot9=13,1,-4,90
;Slot10=0,-10.5,0,180
