name: reload

on:
  push:
    branches-ignore:
      - 'dist/**'
    paths:
      - 'reload/**'
      - '.github/workflows/reload.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup cmake
        uses: lukka/get-cmake@latest

      - name: Setup vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\vcpkg-cache
          key: vcpkg-${{ hashFiles('reload/vcpkg.json') }}
          restore-keys: vcpkg-

      - name: Configure
        shell: pwsh
        run: cmake -S reload -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          $plugins = "package\F4SE\Plugins"
          New-Item -ItemType Directory -Force $plugins | Out-Null
          Copy-Item build\Release\ManualReload.dll $plugins
          Copy-Item reload\ManualReload.ini $plugins
          Compress-Archive -Path package\* -DestinationPath ManualReload.zip

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: ManualReload
          path: package

      - name: Publish build to the dist branch
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          $branch = "dist/reload/${{ github.ref_name }}"
          Copy-Item ManualReload.zip "ManualReload-$sha.zip"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan dist-tmp
          git rm -rfq --cached .
          Remove-Item -Recurse -Force (Get-ChildItem -Force -Exclude .git,"ManualReload-$sha.zip")
          git add -A
          git commit -qm "Build $sha"
          git push -f origin "HEAD:refs/heads/$branch"
