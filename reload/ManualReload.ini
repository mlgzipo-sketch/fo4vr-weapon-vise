; ManualReload 0.3: reload the 10mm pistol by hand, Into the Radius style
[Main]
; 1 = the game's own reload does not refill the gun; the reload button drops the magazine instead
bBlockReload=1
; gunState value of the game while reloading (VR: 8)
iReloadGunState=8
; gunState value at rest (VR: 12): the slide and the magazine are measured then
iIdleGunState=12
; which hand holds the gun: 0 = right, 1 = left (the other hand takes magazines from the belt)
iGunHand=0
; OpenVR button id of the grip
iGripButton=2
bHaptics=1
bMessages=1

[Belt]
; where the free hand finds a magazine: palm height above the feet (game units, 1 = ~1.4 cm)
fBeltLow=55
fBeltHigh=80
; ..and at most this far from the body sideways
fBeltRadius=22

[Magazine]
; hold the reload button: the magazine sticks out this far and waits for the free hand
fExtendDistance=3
; let go of the button: it slides this far and falls
fDropDistance=9
; speed of the magazine sliding out and in (units per second)
fSlideSpeed=45
; a magazine has to come up from below: at most this far off the well's axis
fWellSide=5
; a magazine this close to the magazine well shows the green ghost; let go there and it snaps in
fGhostRadius=14
; this close to the mouth of the well it goes in by itself, even still in the hand
fSnapRadius=5
; slope of the magazine well back from straight down, degrees; -1 = measure it from the gun model
fMagTilt=-1
; a hand this close to a magazine is taken as the one holding it
fHandRadius=16
; seconds a dropped magazine stays on the ground (when you are away from it)
fLooseLifetime=90
; at most this many dropped magazines
iMaxLoose=6

; the magazine in the free hand: turns in the hand bone's frame (degrees); try fHoldRotX=180 if it is upside down
fHoldRotX=0
fHoldRotY=0
fHoldRotZ=0
; how far the top of the magazine sits above the palm
fHoldUp=3

[Slide]
; the free hand this close to the slide grips it; pull back and let go
fSlideGrabRadius=9
; how far the slide travels back
fRackTravel=2.5
; 1 = the reload button also racks the slide when the chamber is empty
bButtonRack=0
; OpenVR button id of the trigger (a reload while it is pulled is the game's auto-reload: ignored)
iTriggerButton=33
; the game's reload animation is held still this long after a press (seconds)
fFreezeSeconds=1.6

[Debug]
iDumpDepth=12
; 1 = log every shot and grip
bDebugLog=1
