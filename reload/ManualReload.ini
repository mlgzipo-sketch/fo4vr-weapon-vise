; ManualReload (probe build): reload by hand, Into the Radius style
[Main]
; 1 = the game's own reload no longer refills the gun
bBlockReload=1
; 1 = the reload button toggles "magazine out" / "magazine in" (test of setting the rounds)
bToggleMagazine=1
; how deep the weapon node tree is written to the log
iDumpDepth=12
; 1 = log every change of the round count
bDebugLog=1
