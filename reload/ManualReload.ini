; ManualReload 0.1: reload the 10mm pistol by hand, Into the Radius style
[Main]
; 1 = the game's own reload does not refill the gun; the reload button drops the magazine instead
bBlockReload=1
; gunState value of the game while reloading (VR: 8)
iReloadGunState=8
; which hand holds the gun: 0 = right, 1 = left (the other hand takes magazines from the belt)
iGunHand=0
; OpenVR button id of the grip
iGripButton=2
bHaptics=1
bMessages=1

[Belt]
; where the free hand finds a magazine: palm height above the feet (game units, 1 = ~1.4 cm)
fBeltLow=35
fBeltHigh=95
; ..and at most this far from the body sideways
fBeltRadius=40

[Magazine]
; a magazine this close to the magazine well shows the green ghost; let go there and it snaps in
fGhostRadius=14
; this close it goes in by itself
fSnapRadius=4
; a hand this close to a magazine is taken as the one holding it
fHandRadius=16
; seconds a dropped magazine stays on the ground (when you are away from it)
fLooseLifetime=90
; at most this many dropped magazines
iMaxLoose=6

[Debug]
iDumpDepth=12
; 1 = log every shot and grip
bDebugLog=1
