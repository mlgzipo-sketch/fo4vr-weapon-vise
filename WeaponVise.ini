; WeaponVise settings. Distances are in game units (1 unit = about 1.4 cm).

; OpenVR button that grabs: 2 = grip.
; Controller axis that points forward (for laying the weapon down): 0 = X, 1 = Y, 2 = Z.
iForwardAxis=1
iGripButton=2
; Hand that holds the weapon: 0 = right, 1 = left.
iWeaponHand=0

; Weapon hand (palm) this close to the vise can clamp the weapon.
fViseRadius=20
; Where the vise is in the workbench model (game units), and how high the weapon sits above it.
fViseX=33
fViseY=26
fViseZ=68
fViseLift=9
; Seconds to hold grip to clamp.
fClampHold=0.5

; Hand this close to a part grabs it.
fGrabRadius=9
; Pull the gripped part this far to take it off.
fPullDistance=8
; A carried part this close to its place on the weapon snaps on.
fAttachRadius=9
; ...or this close to the weapon, when its place is not known yet.
fAttachRadiusAny=6

; Grip on the weapon body and hold still to take it back.
fWeaponGrabRadius=14
fUnclampHold=1.5
fUnclampStill=6

; Loose parts are laid out on the bench top (workbench model space), in rows.
fRackX=48
fRackY=48
fRackZ=61
fRackStep=6
iRackPerRow=6

; Reload the weapon's model when it does not show a change.
bRefresh3D=1
; Write the weapon's model tree to WeaponVise.log (for development).
bLogTree=1
; Hints on screen.
bMessages=1
; Log what each grip press near the clamped weapon found.
bLogGrab=1
; More detail in the log.
bDebugLog=0
