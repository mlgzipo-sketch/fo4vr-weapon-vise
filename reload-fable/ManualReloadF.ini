; ManualReloadF 0.8: hand reloading of guns with a detachable magazine. Lines starting with ; are comments.
; Only one of ManualReload / ManualReloadF may be enabled at a time.
[Main]
; 1 = every gun with a detachable magazine (assault and combat rifles, SMG, Deliverer, pipe guns, combat shotgun); 0 = only the 10mm pistol
bAllGuns=1
; ROCK 1.0 or newer: ROCK itself puts the free hand and its fingers on the magazine and the slide (0 = this plugin alone, as before)
bRockParts=1
; a magazine taken from the belt: the grip is shown to ROCK so that it closes the hand on the magazine
bRockBeltHandover=1
; 1 = a magazine pulled out of the well turns in the hand to the pose of a magazine from the belt
bHoldPoseOnExit=0
; a magazine ROCK holds in the hand is drawn where ROCK has it, so the hand and the magazine cannot drift apart
bRockPlacesHeld=1
; revolvers and the break-action shotgun: the reload button opens / closes them, muzzle up empties them,
; rounds from the belt go in at the breech, the free hand on the gun or a jerk of the gun closes it
bBreech=1
; 1 = recording: the plugin does nothing with the gun, the game reloads it by itself, and each reload is written to
; Data\F4SE\Plugins\ManualReloadF_anim\<weapon id>.txt (which parts turn or slide, about what, when)
bRecordAnim=1
fCylinderSwing=-80    ; degrees the cylinder swings out (minus = to the gun's left; flip the sign if it goes the wrong way)
fBreakAngle=-35       ; degrees a break action opens (minus = barrels down)
fFlickSpeed=150       ; the gun jerked this fast closes it
fBreechRadius=6       ; rounds this close to the open breech go in
; sounds played by the plugin itself (0 = through the script)
bNativeSound=1
iSoundFlags=16
bBlockReload=1        ; 1 = the game's own reload is undone, the magazine is handled by hand
bDebugLog=1           ; detail in ManualReloadF.log (for testing)
iGunHand=0            ; 0 = the gun is in the right hand, 1 = in the left
bHaptics=1
bMessages=1

[Buttons]
iGripButton=2
iTriggerButton=33
iReloadButton=7       ; A / X on the gun hand: tap = the magazine drops, hold = it sticks out and waits for the free hand
fHoldSeconds=0.25

[Grip]
bHideGrip=1           ; hide the free hand's grip from other mods (ROCK) while it works a magazine or the slide
bBlockTwoHand=1       ; no second-hand hold on the gun while its magazine is out
fGunRadius=28
bRegripAfterSeat=1    ; the grip is given back the moment the magazine clicks in
bSpareFromBelt=1      ; grip at the belt while the gun still has its magazine: a spare one as a real object

[Belt]
fBeltLow=55           ; height above the feet
fBeltHigh=80
fBeltRadius=22
fShoulderHeight=88    ; let go of a magazine behind you above this height: it is put away

[Well]
fExtendDistance=3.2   ; how far the magazine sticks out while the button is held
fSlideSpeed=40
fRailLength=-1        ; travel until the magazine is clear of the well; below 0 = measured from the model
fMagTilt=-1           ; slope of the well in degrees; below 0 = measured from the model
fWellSide=3.5         ; how close to the well's line the top of the magazine must be to be caught
fCaptureAhead=1.0
fSeatAt=0.3           ; pushed this close to home: it clicks in
fSeatRelease=1.5      ; let go this close to home: it clicks in; further out it falls
fMagGrabRadius=9
fGrabUp=2.0           ; the palm takes a magazine that sticks out this far above its baseplate

[Hand]
; a magazine in the hand (from the belt, or once out of the well): held by its baseplate, pointing along the fingers
fHoldUp=2.0          ; the baseplate is this far behind the palm's middle (minus = ahead of it, toward the fingers)
fHoldSide=0
fHoldForward=0
fHoldRotX=0           ; 0 = the magazine stands in the fist (its top out of the thumb side), 90 = along the fingers
fHoldRotY=0
fHoldRotZ=0
iHoldFlip=0           ; 1 = turn it over if it comes out upside down
fFingerCurl=0.35      ; 0 = fist, 1 = open hand

[Slide]
fSlideGrabRadius=8
fSlideGrabAt=0.2      ; the hand takes the slide this part of its length from its rear end
fSlideGrabHigh=0.85   ; ..and this part of its height from its underside (1 = the very top)
fRackTravel=5
fSlideLockAt=0.8
; the round seen while the slide is open: in the chamber when one is loaded, else on top of the magazine
bShowRound=1
; part of the slide's travel after which it is seen
fRoundOpenAt=0.3
; where it sits: the chambered one from the magazine's top this much up and forward; the magazine's one this much up
fChamberUp=0.9
fChamberForward=0.9
fRoundUp=0
; turns of the round model in the gun's frame (degrees) and its size
fRoundRotX=0
fRoundRotY=0
fRoundRotZ=0
fRoundScale=1
; model of the round (empty = the casing of the gun's ammo; the log line "Round:" names what was found)
sRoundModel=
fFreezeSeconds=1.6

[Loose]
fHandRadius=16
fLooseLifetime=90
iMaxLoose=6
